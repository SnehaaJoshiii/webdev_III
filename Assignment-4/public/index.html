<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PERSONALCHAT</title>
<style>
  :root {
    --ink: #202531;
    --muted: #737b8c;
    --line: #e7e9ef;
    --panel: #ffffff;
    --accent: #5865f2;
    --accent-soft: #edf0ff;
    --page: #f6f7fb;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 15%, #e9ecff 0, transparent 28%),
      radial-gradient(circle at 88% 85%, #e8f7f4 0, transparent 24%),
      var(--page);
  }
  .shell {
    width: min(920px, 100%);
    min-height: 620px;
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    overflow: hidden;
    border: 1px solid rgba(32, 37, 49, 0.08);
    border-radius: 24px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgba(54, 63, 97, 0.14);
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    padding: 28px 22px;
    color: #dfe4ff;
    background: #262a40;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 38px;
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--accent);
  }
  .brand-mark::before {
    content: "";
    width: 16px;
    height: 12px;
    border: 2px solid white;
    border-radius: 6px;
  }
  .sidebar-label {
    margin: 0 0 10px;
    color: #9299b5;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .room-sidebar { display: flex; flex-direction: column; gap: 6px; }
  .room-sidebar span {
    padding: 10px 12px;
    border-radius: 8px;
    color: #f6f7ff;
    background: rgba(255, 255, 255, 0.08);
  }
  .sidebar-footer { margin-top: auto; color: #9299b5; font-size: 12px; }
  .main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
  .topbar {
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.02em; }
  .status { color: #4b8a65; font-size: 12px; font-weight: 700; }
  .room-control { display: flex; align-items: center; gap: 8px; }
  input {
    min-width: 0;
    height: 42px;
    border: 1px solid #dfe3ec;
    border-radius: 10px;
    outline: none;
    background: #fafbfe;
    color: var(--ink);
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    height: 42px;
    border: 0;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 750;
    color: white;
    background: var(--accent);
    cursor: pointer;
  }
  button:hover { background: #4854dd; }
  #auth {
    grid-column: 1 / -1;
    width: min(420px, calc(100% - 40px));
    align-self: center;
    justify-self: center;
    padding: 36px;
  }
  #auth h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.04em; }
  #auth p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
  #auth input { width: 100%; margin: 0 0 10px; padding: 0 14px; }
  #auth button { width: 100%; margin-top: 8px; }
  #err { display: block; min-height: 20px; margin-top: 10px; color: #c53c50; }
  #chat { display: none; grid-template-rows: subgrid; min-height: 0; grid-row: 1 / -1; }
  #log {
    min-height: 0;
    overflow-y: auto;
    padding: 22px 24px;
    background: #fbfcff;
  }
  #log > div {
    max-width: 78%;
    width: fit-content;
    margin: 8px 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: white;
    border: 1px solid var(--line);
    line-height: 1.45;
  }
  #log > .sys {
    max-width: 100%;
    margin: 10px auto;
    border: 0;
    background: transparent;
    color: var(--muted);
    text-align: center;
    font-size: 12px;
  }
  #log > .note {
    border-color: #f4dda9;
    background: #fff9e9;
    color: #86611d;
  }
  .composer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 14px 24px 20px;
    border-top: 1px solid var(--line);
  }
  .composer input { width: 100%; padding: 0 14px; }
  #typing { grid-column: 1 / -1; min-height: 16px; color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) {
    body { padding: 0; place-items: stretch; }
    .shell { min-height: 100vh; grid-template-columns: 1fr; border: 0; border-radius: 0; }
    .sidebar { display: none; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .room-control { width: 100%; }
    .room-control input { flex: 1; }
    #log > div { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><span class="brand-mark"></span> PERSONALCHAT</div>
  <p class="sidebar-label">Workspace</p>
  <div class="room-sidebar"><span># general</span></div>
  <div class="sidebar-footer">Secure room messaging</div>
</aside>
<main class="main">
<div id="auth">
  <h1>Welcome back</h1>
  <p>Sign in to join the conversation and continue where you left off.</p>
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login &amp; Connect</button> <span id="err" style="color:red"></span>
  <p style="margin-top:14px;font-size:13px">New account? Create one with POST /api/auth/signup.</p>
</div>
<div id="chat">
  <header class="topbar">
    <div><h1>Team conversation</h1><div class="status">● Connected</div></div>
    <div class="room-control">
      <input id="room" value="general" aria-label="Room name">
      <button onclick="join()">Join room</button>
    </div>
  </header>
  <div id="log"></div>
  <div class="composer">
    <div id="typing" class="sys"></div>
    <input id="msg" placeholder="Write a message..." oninput="socket.emit('typing', room())" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>
</main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket;
const $ = (id) => document.getElementById(id);
const room = () => $('room').value;
function add(text, cls) {
  const d = document.createElement('div'); d.textContent = text; if (cls) d.className = cls;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
}
async function login() {
  const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
  const data = await res.json();
  if (!res.ok) { $('err').textContent = data.message; return; }
  $('auth').style.display = 'none'; $('chat').style.display = 'grid';
  socket = io({ auth: { token: data.token } });
  socket.on('chatMessage', (m) => add(`[${m.room}] ${m.username}: ${m.text}`));
  socket.on('history', (h) => h.forEach((m) => add(`[${m.room}] ${m.username}: ${m.text}`)));
  socket.on('systemMessage', (m) => add(m.text, 'sys'));
  socket.on('notification', (n) => add('🔔 ' + n.message, 'note'));
  socket.on('errorMessage', (e) => add(e, 'sys'));
  socket.on('connect_error', (e) => add('Connection error: ' + e.message, 'sys'));
  socket.on('typing', (t) => { $('typing').textContent = t.username + ' is typing...'; setTimeout(() => $('typing').textContent = '', 1200); });
  join();
}
function join() { $('log').innerHTML = ''; socket.emit('joinRoom', room()); }
function send() { const t = $('msg').value.trim(); if (!t) return; socket.emit('chatMessage', { room: room(), text: t }); $('msg').value = ''; }
</script>
</body>
</html>
